<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nivult Credits — immagine prodotto</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script>
tailwind.config = { theme: { extend: {
  fontFamily: { sans: ['Inter','system-ui','sans-serif'], mono: ['JetBrains Mono','monospace'] },
  colors: {
    brand: {50:'#eef4ff',100:'#dfeaff',400:'#5e8bff',500:'#3b6ef6',600:'#2f5de0',700:'#2549b8'},
    mint: {400:'#2fe0b6',500:'#0fbf9a',600:'#0aa588'},
  }
}}}
</script>
<style>
  body { margin: 0; }
  @keyframes pulse-dot { 0%,100% { box-shadow: 0 0 0 0 rgba(15,191,154,.5);} 50% { box-shadow: 0 0 0 10px rgba(15,191,154,0);} }
  .live-dot { animation: pulse-dot 2.2s infinite; }
</style>
</head>
<body>
<div class="relative overflow-hidden bg-slate-950" style="width:1200px;height:1200px">

  <!-- mesh di marca: brand, viola, menta -->
  <div class="absolute -top-48 -left-48 rounded-full" style="width:760px;height:760px;background:#3b6ef6;opacity:.28;filter:blur(140px)"></div>
  <div class="absolute -bottom-56 -right-40 rounded-full" style="width:820px;height:820px;background:#8b5cf6;opacity:.26;filter:blur(150px)"></div>
  <div class="absolute top-1/3 left-1/2 rounded-full" style="width:560px;height:560px;background:#0fbf9a;opacity:.18;filter:blur(130px)"></div>

  <!-- trama di puntini -->
  <div class="absolute inset-0" style="background-image:radial-gradient(rgba(255,255,255,.055) 1.2px, transparent 1.2px);background-size:30px 30px"></div>

  <!-- wordmark -->
  <div class="absolute top-16 left-16 flex items-center gap-4">
    <div class="grid place-items-center rounded-2xl shadow-2xl" style="width:64px;height:64px;background:linear-gradient(135deg,#3b6ef6,#8b5cf6 55%,#0fbf9a);box-shadow:0 18px 44px -12px rgba(139,92,246,.55)">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>
    </div>
    <span class="text-white font-black tracking-tight" style="font-size:44px">nivult<span class="text-mint-400">.</span></span>
  </div>

  <!-- etichetta prodotto -->
  <div class="absolute top-[76px] right-16 flex items-center gap-2.5 rounded-full border border-white/15 bg-white/5 px-5 py-2.5 backdrop-blur">
    <span class="live-dot rounded-full bg-mint-400" style="width:9px;height:9px"></span>
    <span class="text-white/80 font-bold uppercase" style="font-size:15px;letter-spacing:.14em">API Credits</span>
  </div>

  <!-- la card dei crediti, centro palco -->
  <div class="absolute left-1/2" style="top:300px;transform:translateX(-50%);width:920px">
    <div class="rounded-[28px] border border-white/10 shadow-2xl" style="background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.03));backdrop-filter:blur(14px);box-shadow:0 44px 90px -30px rgba(0,0,0,.7)">
      <div class="h-2 rounded-t-[28px]" style="background:linear-gradient(90deg,#3b6ef6,#8b5cf6 50%,#2fe0b6)"></div>
      <div class="px-14 pt-12 pb-12">
        <p class="text-white/50 font-bold uppercase" style="font-size:17px;letter-spacing:.16em">Credit balance</p>
        <div class="mt-3 flex items-end gap-5">
          <span class="font-black tabular-nums leading-none" style="font-size:148px;background:linear-gradient(90deg,#5e8bff,#a78bfa 55%,#2fe0b6);-webkit-background-clip:text;background-clip:text;color:transparent">100,000</span>
          <span class="text-white/60 font-semibold pb-7" style="font-size:30px">credits</span>
        </div>

        <!-- mini grafico della spesa -->
        <div class="mt-9 flex items-end gap-[10px]" style="height:120px">
          <div class="flex-1 rounded-t-md" style="height:18%;background:rgba(255,255,255,.10)"></div>
          <div class="flex-1 rounded-t-md" style="height:30%;background:rgba(255,255,255,.10)"></div>
          <div class="flex-1 rounded-t-md" style="height:24%;background:rgba(255,255,255,.10)"></div>
          <div class="flex-1 rounded-t-md" style="height:42%;background:rgba(94,139,255,.55)"></div>
          <div class="flex-1 rounded-t-md" style="height:36%;background:rgba(94,139,255,.55)"></div>
          <div class="flex-1 rounded-t-md" style="height:55%;background:rgba(139,92,246,.6)"></div>
          <div class="flex-1 rounded-t-md" style="height:48%;background:rgba(139,92,246,.6)"></div>
          <div class="flex-1 rounded-t-md" style="height:70%;background:rgba(167,139,250,.7)"></div>
          <div class="flex-1 rounded-t-md" style="height:62%;background:rgba(47,224,182,.65)"></div>
          <div class="flex-1 rounded-t-md" style="height:86%;background:linear-gradient(180deg,#2fe0b6,#3b6ef6)"></div>
        </div>

        <div class="mt-9 flex items-center gap-3">
          <span class="rounded-lg bg-mint-500/15 text-mint-400 font-bold px-4 py-2" style="font-size:16px">Never expire</span>
          <span class="rounded-lg bg-brand-500/15 text-brand-400 font-bold px-4 py-2" style="font-size:16px">1 credit = 1 call</span>
          <span class="rounded-lg bg-white/8 text-white/60 font-bold px-4 py-2" style="font-size:16px;background:rgba(255,255,255,.08)">Every call itemized</span>
        </div>
      </div>
    </div>
  </div>

  <!-- la riga di fondo: cosa comprano -->
  <div class="absolute bottom-[86px] inset-x-16 flex items-center justify-between">
    <p class="text-white/70 font-semibold" style="font-size:26px">Hiring &amp; company intelligence, read at the source.</p>
    <p class="font-mono text-mint-400/90 font-semibold" style="font-size:19px">api.nivult.com/v1</p>
  </div>
</div>
</body>
</html>
