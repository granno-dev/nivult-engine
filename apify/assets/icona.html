<!DOCTYPE html>
<html><head><meta charset="utf-8">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</head><body>
<!-- icona quadrata per lo store Apify: la "n." di marca sul gradiente -->
<div style="width:512px;height:512px;display:grid;place-items:center;background:linear-gradient(135deg,#3b6ef6,#8b5cf6 52%,#0fbf9a);border-radius:110px;position:relative;overflow:hidden">
  <div style="position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.14) 1.5px, transparent 1.5px);background-size:26px 26px"></div>
  <div style="font-family:Inter,sans-serif;font-weight:900;color:white;font-size:290px;line-height:1;letter-spacing:-.06em;position:relative;text-shadow:0 14px 44px rgba(0,0,0,.28);transform:translateY(-14px)">n<span style="color:#2fe0b6">.</span></div>
</div>
</body></html>
