<!DOCTYPE html><html><head><meta charset="utf-8"><script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@800;900&display=swap" rel="stylesheet">
<style>body{margin:0}</style></head><body>
<div style="width:100vw;height:100vh;display:grid;place-items:center;background:#020617;position:relative;overflow:hidden">
  <div style="position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.06) 1.2px,transparent 1.2px);background-size:8vh 8vh"></div>
  <div style="display:flex;align-items:flex-end;gap:4.5vh;position:relative">
    <div style="width:9vh;height:16vh;border-radius:2.2vh;background:linear-gradient(180deg,#3b6ef6,#2549b8)"></div>
    <div style="width:9vh;height:26vh;border-radius:2.2vh;background:linear-gradient(180deg,#8b5cf6,#6d28d9)"></div>
    <div style="width:9vh;height:38vh;border-radius:2.2vh;background:linear-gradient(180deg,#2fe0b6,#0fbf9a);box-shadow:0 0 8vh rgba(47,224,182,.45)"></div>
  </div>
</div></body></html>
