[project]
name = "nivult-engine"
version = "0.1.0"
description = "Motore Nivult: ingestione offerte, matching a imbuto, consegna digest"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.18",
  "email-validator>=2.2",
  # Non sono opzionali e non sono "roba di deploy": crypto.py e storage.py
  # stanno nel percorso di import di check_modules e dell'API. Mancavano qui
  # perché sul Mac e sul server erano finiti nel venv a mano, e con .env
  # accanto nessuno se ne accorgeva. In CI, dove si parte da niente, l'import
  # falliva — ed è il motivo per cui quella pipeline non è MAI stata verde.
  "cryptography>=43",   # busta AES-256-GCM dei CV
  "boto3>=1.35",        # Hetzner Object Storage, S3-compatibile
  "pypdf>=5",           # estrai_testo: i CV in PDF
  "python-docx>=1.1",   # estrai_testo: i CV in DOCX
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "scripts"]
