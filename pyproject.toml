[project]
name = "nivult-engine"
version = "0.1.0"
description = "Motore Nivult: ingestione offerte, matching a imbuto, consegna digest"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "scripts"]
